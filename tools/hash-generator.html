<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hash Generator — SPARK Tools</title>
  <meta name="description" content="Generate SHA-1, SHA-256, and SHA-512 hashes instantly in your browser. 100% secure and client-side.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#100f0c" media="(prefers-color-scheme: dark)">

  <script>
    (function () {
      try {
        var s = localStorage.getItem('theme');
        var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', s || (d ? 'dark' : 'light'));
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a href="../" class="logo" aria-label="SPARK home">SPARK<span class="dot">.</span></a>
      <nav id="primary-nav" class="nav" data-nav aria-label="Primary">
        <a href="../">Home</a>
        <a href="../posts.html">Posts</a>
        <a href="../#tools">Tools</a>
        <a href="../#about">About</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle theme">
          <svg class="icon icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn menu-btn" type="button" data-menu-toggle aria-expanded="false" aria-controls="primary-nav" aria-label="Menu">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="container" style="padding-top: 40px; padding-bottom: 60px; max-width: 800px;">
    <div class="section-head">
      <h2>Hash Generator</h2>
    </div>
    <p class="prose" style="margin-bottom: 24px;">Generate cryptographic hashes securely in your browser. No data is sent to any server.</p>

    <div class="tool-box">
      <label for="hash-input" class="mono" style="display:block; margin-bottom: 8px; font-size: 0.9rem;">INPUT TEXT</label>
      <textarea id="hash-input" rows="4" placeholder="Type or paste your text here..." class="tool-textarea"></textarea>

      <div style="display: flex; gap: 12px; margin-top: 16px; align-items: center; flex-wrap: wrap;">
        <select id="hash-algo" class="tool-select">
          <option value="SHA-256">SHA-256 (Recommended)</option>
          <option value="SHA-1">SHA-1</option>
          <option value="SHA-512">SHA-512</option>
        </select>
        <button id="generate-btn" class="btn-primary">Generate Hash</button>
      </div>

      <div id="hash-result-container" style="display: none; margin-top: 24px;">
        <label class="mono" style="display:block; margin-bottom: 8px; font-size: 0.9rem; color: var(--accent);">RESULT (HEX)</label>
        <div style="position: relative;">
          <textarea id="hash-output" rows="2" readonly class="tool-textarea" style="background: var(--surface); border-color: var(--accent);"></textarea>
          <button id="copy-btn" class="btn-copy">Copy</button>
        </div>
      </div>
    </div>

    <div class="ad-slot" aria-hidden="true" style="margin-top: 40px;">Advertisement</div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="mono">© <span data-year></span> SPARK</p>
      <nav class="footer-links" aria-label="Footer">
        <a href="../privacy.html">Privacy</a>
        <a href="../#about">Contact</a>
      </nav>
    </div>
  </footer>

  <script src="../js/main.js" defer></script>
  
  <!-- سكريبت الأداة -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const input = document.getElementById('hash-input');
      const algoSelect = document.getElementById('hash-algo');
      const generateBtn = document.getElementById('generate-btn');
      const resultContainer = document.getElementById('hash-result-container');
      const output = document.getElementById('hash-output');
      const copyBtn = document.getElementById('copy-btn');

      async function generateHash() {
        const text = input.value;
        if (!text) {
          resultContainer.style.display = 'none';
          return;
        }

        const algo = algoSelect.value;
        const encoder = new TextEncoder();
        const data = encoder.encode(text);

        try {
          const hashBuffer = await crypto.subtle.digest(algo, data);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
          
          output.value = hashHex;
          resultContainer.style.display = 'block';
        } catch (e) {
          output.value = "Error generating hash. Your browser might not support this.";
          resultContainer.style.display = 'block';
        }
      }

      generateBtn.addEventListener('click', generateHash);
      
      // نسخ النتيجة
      copyBtn.addEventListener('click', function() {
        output.select();
        document.execCommand('copy');
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 2000);
      });
    });
  </script>
</body>
</html>
